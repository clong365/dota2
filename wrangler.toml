name = "dota2"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[vars]
# 抓取最近 N 天(含今天,按 UTC+8 划分);0 = 不过滤,展示联赛全部比赛
DAYS = "0"
# OpenDota 联赛 ID,默认 19719 = The International 2026
# LEAGUE_ID = "19719"

# wrangler kv:namespace create GAMES_KV 后把 id 填到这里
[[kv_namespaces]]
binding = "GAMES_KV"
id = "6db97639c04640838b4d8b47303fc12a"
preview_id = "GAMES_KV_LOCAL"

# OpenDota API key 用 npx wrangler secret put OPENDOTA_API_KEY 配置(不要写在这里)

[triggers]
crons = ["*/30 * * * *"]
